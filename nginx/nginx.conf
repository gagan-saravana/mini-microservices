events {}
http {
  include /etc/nginx/mime.types;
  upstream api { server api:8000; }   # resolved to every replica IP at startup
  server {
    listen 80;

    location / {                      # the UI (static files)
      root /usr/share/nginx/html;
      index index.html;
    }

    location /notes {                 # the API, load balanced
      proxy_pass http://api;
      add_header X-Upstream $upstream_addr always;
    }
  }
}
